# Render blueprint. `render blueprint launch` creates the web service and walks
# through the environment values below.
#
# Neither the data nor the proof storage is defined here. Both live outside
# Render:
#   data    -> Cloud Firestore
#   storage -> Cloudflare R2, a private bucket
# Because the credentials are a prompt rather than a generated value, they are
# never written into this file.
#
# The plan below is `starter`, not `free`, for one reason: Render's free plan
# blocks all outbound traffic on ports 25, 465 and 587, which is what
# smtp.office365.com needs. On the free plan the app still works, but every
# notification email is silently suppressed (see app/utils/email.py).

services:
  - type: web
    name: permission-system
    runtime: python
    plan: starter
    region: singapore
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120 --access-logfile - wsgi:app
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      # Cloud Firestore holds every record: users, requests, classes, rosters
      # and attendance.
      #
      # The service account's private key bypasses Firestore security rules, so
      # it is a server-side secret and is never rendered into a template. Missing
      # credentials do not stop the boot: the app serves its health path and
      # every data-backed request reports the store as unavailable.
      - key: FIREBASE_PROJECT_ID
        value: permissionsystem-aus
      - key: FIRESTORE_DATABASE
        value: "(default)"
      # Render has no key file on disk, so the JSON itself goes in the
      # environment. It is multi-line; the dashboard keeps it intact and the app
      # parses it as JSON.
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      # A hung store call holds a gunicorn worker thread, and the page is waiting
      # on the thread, so the budget is short and a second attempt rides out a
      # single dropped call.
      - key: FIRESTORE_TIMEOUT_SECONDS
        value: "8"
      - key: FIRESTORE_RETRIES
        value: "2"
      # Render polls /healthz continuously; without a cache each poll costs a
      # query and the probe becomes part of the load it is measuring.
      - key: HEALTH_DB_CACHE_SECONDS
        value: "30"
      - key: CLIENT_ID
        sync: false
      - key: TENANT_ID
        sync: false
      - key: CLIENT_SECRET
        sync: false
      # Must match a registered Web redirect URI in Entra ID exactly.
      # If the service is renamed, change this and the Entra entry together.
      - key: REDIRECT_URI
        value: https://permissionsystem.onrender.com/auth/callback
      # Cloudflare R2 holds the uploaded proofs. R2 speaks the S3 API, so the app
      # talks to it with boto3 against <account>.r2.cloudflarestorage.com and
      # nothing sits in front of it to proxy uploads.
      #
      # The token bypasses every bucket policy, so it is a server-side secret and
      # is never rendered into a template. Uploads fail cleanly (a plain error on
      # the form) if it is missing, rather than at import time.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: permission-system
      - key: STORAGE_TIMEOUT_SECONDS
        value: "30"
      # Only read when STORAGE_BACKEND=supabase.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: permission-system
      - key: REPORT_TIMEZONE
        value: Asia/Kolkata
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: DEV_MODE
        value: "false"
      - key: FLASK_DEBUG
        value: "false"
# Render blueprint. `render blueprint launch` creates the web service and walks
# through the environment values below.
#
# The database and proof storage are NOT defined here. Both live in Supabase:
#   database -> Supabase Postgres (Project Settings -> Database -> URI)
#   storage  -> Supabase Storage, a private bucket
# Because DATABASE_URL is a prompt rather than a generated value, it is never
# written into this file.
#
# The plan below is `starter`, not `free`, for one reason: Render's free plan
# blocks all outbound traffic on ports 25, 465 and 587, which is what
# smtp.office365.com needs. On the free plan the app still works, but every
# notification email is silently suppressed (see app/utils/email.py).

services:
  - type: web
    name: permission-system
    runtime: python
    plan: starter
    region: singapore
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120 --access-logfile - wsgi:app
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      # Supabase Postgres, DIRECT connection: db.<ref>.supabase.co.
      #
      # Not the Supavisor pooler. Supavisor reaps and reschedules session
      # connections underneath the client -- which is where the production log's
      # "consuming input failed: SSL SYSCALL error: EOF detected" came from --
      # and it shares one slot limit between everything pointed at the project.
      # This app pools for itself, so there is nothing for Supavisor to pool, and
      # the DSN below is dialled exactly as written: no derived host, no probe,
      # no fallback.
      #
      # Direct is an IPv6-only AAAA record, so this service needs IPv6 egress to
      # resolve db.<ref>.supabase.co. The pool opens in the background either way,
      # so an unresolvable host boots and recovers on its own.
      - key: DATABASE_URL
        sync: false
      # The pool is per gunicorn worker: 6 x 2 workers = 12 connections, which is
      # charged directly against the project's connection limit now that
      # Supavisor is bypassed. Keep it inside that limit.
      #
      # MAX must exceed --threads, or a worker deadlocks against itself. MIN is
      # what makes that survivable: the pool grows one connection at a time and
      # only once a client is already queued, and a connect over the WAN costs
      # over a second. At MIN=1, losing that one connection left the worker with
      # nothing to serve and every request behind it timed out, which is exactly
      # what the production log showed. MIN = --threads keeps a warm connection
      # per thread.
      - key: DB_POOL_MAX
        value: "6"
      - key: DB_POOL_MIN
        value: "4"
      # Must match the gunicorn flags in startCommand. Read only to size the
      # pool and to state the connection budget in the startup log.
      - key: DB_WORKER_THREADS
        value: "4"
      - key: DB_WORKER_COUNT
        value: "2"
      # Kept separate and short on purpose. A single shared 10s value made every
      # request stall for ten seconds whenever the pool was saturated.
      - key: DB_POOL_TIMEOUT
        value: "5"
      - key: DB_CONNECT_TIMEOUT
        value: "5"
      # Two attempts per request, and a pool that recycles its idle sockets
      # every four minutes. Without the recycle the first request after an idle
      # spell is the one that pays for a socket the server has already closed.
      - key: DB_POOL_RETRIES
        value: "2"
      - key: DB_POOL_MAX_IDLE
        value: "240"
      - key: DB_POOL_MAX_LIFETIME
        value: "1800"
      # A socket dropped while idle still looks alive to libpq, so it is only
      # found dead when a query goes out on it. This bounds how often a checkout
      # re-verifies the connection with a SELECT 1 instead.
      - key: DB_POOL_PING_INTERVAL
        value: "30"
      - key: DB_POOL_RECONNECT_TIMEOUT
        value: "30"
      # Render polls /healthz continuously; without a cache each poll took a
      # pooled connection and the probe became part of the contention.
      - key: HEALTH_DB_CACHE_SECONDS
        value: "30"
      - key: CLIENT_ID
        sync: false
      - key: TENANT_ID
        sync: false
      - key: CLIENT_SECRET
        sync: false
      # Must match a registered Web redirect URI in Entra ID exactly.
      # If the service is renamed, change this and the Entra entry together.
      - key: REDIRECT_URI
        value: https://permissionsystem.onrender.com/auth/callback
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: proofs
      - key: REPORT_TIMEZONE
        value: Asia/Kolkata
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: DEV_MODE
        value: "false"
      - key: FLASK_DEBUG
        value: "false"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false
